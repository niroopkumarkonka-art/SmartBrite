name: Build and Run SmartBrite Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    name: Build, Verify & Run Server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npm run lint

      - name: Build Application (Vite Frontend & Server Bundle)
        run: npm run build

      - name: Start Application & Health Check
        env:
          PORT: 3000
          NODE_ENV: production
        run: |
          echo "Starting SmartBrite server..."
          node dist/server.cjs &
          SERVER_PID=$!
          
          echo "Waiting for server to become responsive..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/api/health | grep -q "healthy"; then
              echo "✅ SmartBrite application is live and healthy!"
              break
            fi
            sleep 1
          done

          echo "Running API smoke tests..."
          curl -s http://127.0.0.1:3000/api/health | jq .
          curl -s http://127.0.0.1:3000/api/menu | jq '.[0:2]'

          echo "Shutting down test instance..."
          kill $SERVER_PID || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartbrite-dist
          path: dist/
          retention-days: 7
